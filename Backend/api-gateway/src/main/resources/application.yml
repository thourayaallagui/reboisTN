server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"   # front Angular
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: utilisateurs
          uri: lb://UTILISATEURS
          predicates:
            - Path=/api/utilisateurs/**
        - id: evenements
          uri: lb://EVENEMENTS
          predicates:
            - Path=/api/evenements/**
        - id: inscriptions
          uri: lb://INSCRIPTIONS
          predicates:
            - Path=/api/inscriptions/**
        - id: arbres
          uri: lb://ARBRES
          predicates:
            - Path=/api/arbres/**
        - id: suivi
          uri: lb://SUIVI
          predicates:
            - Path=/api/suivis/**
        - id: notifications
          uri: lb://NOTIFICATIONS
          predicates:
            - Path=/api/notifications/**
        - id: statistiques
          uri: lb://STATISTIQUES
          predicates:
            - Path=/api/statistiques/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
# La validation du JWT Keycloak sera ajoutée en S8 (sécurité).
