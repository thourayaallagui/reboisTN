server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # En local (IDE) : dossier config-repo voisin. En Docker : volume monté sur /config-repo
          search-locations: ${CONFIG_REPO_PATH:file:../config-repo}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
