# ReboisTN - lancement : cd Backend && docker compose up -d --build
# Les microservices ms-* seront ajoutés au fil des séances (S5 à S9).
name: reboistn

networks:
  reboistn-net:

services:
  discovery-server:
    build: ./discovery-server
    ports: ["8761:8761"]
    networks: [reboistn-net]

  config-server:
    build: ./config-server
    ports: ["8888:8888"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      CONFIG_REPO_PATH: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on: [discovery-server]
    networks: [reboistn-net]

  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on: [discovery-server]
    networks: [reboistn-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    networks: [reboistn-net]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports: ["8180:8180"]
    networks: [reboistn-net]

  # ms-utilisateurs, ms-evenements, ms-inscriptions, ms-arbres, ms-suivi,
  # ms-notifications, ms-statistiques (+ MySQL, MongoDB) : à ajouter de S5 à S9
